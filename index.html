<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuickPick Express | Delivery & Logistics</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabaseClient.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');
    :root { --ink:#0e4c69; --muted:#5d7682; --paper:#f7f7f2; --white:#fff; --red:#ef4b3f; --blue:#1468a5; --line:#dce8e3; --shadow:0 20px 60px rgba(14,76,105,.12); }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:var(--paper); font-family:'DM Sans',sans-serif; }
    button,input { font:inherit; }
    button { cursor:pointer; border:0; }
    .shell { max-width:1240px; margin:auto; padding:0 30px; }
    .topbar { height:76px; display:flex; align-items:center; justify-content:space-between; }
    .brand { display:flex; align-items:center; gap:11px; font-family:'Space Grotesk'; font-size:20px; font-weight:700; text-decoration:none; color:var(--ink); }
    .brand-mark { height:40px; display:flex; align-items:center; }
    .brand-mark img { height:100%; width:auto; object-fit:contain; border-radius:8px; }
    .brand em { font-style:normal; color:#f7b32b; }
    .hero { padding:80px 0; text-align:center; max-width:700px; margin:auto; }
    h1 { font-family:'Space Grotesk',sans-serif; font-size:44px; letter-spacing:-2px; margin:10px 0 20px; }
    .primary { background:var(--red); color:white; padding:14px 24px; border-radius:9px; font-weight:700; box-shadow:0 8px 18px rgba(239,75,63,.2); }
    .outline { background:white; color:var(--ink); padding:13px 22px; border:1px solid var(--line); border-radius:9px; font-weight:700; }
    .actions { display:flex; justify-content:center; gap:15px; margin-top:30px; }
    .modal-backdrop { display:none; position:fixed; inset:0; background:rgba(16,35,50,.55); z-index:1000; place-items:center; padding:20px; }
    .modal-backdrop.open { display:grid; }
    .modal { background:white; width:min(420px,100%); border-radius:16px; padding:28px; box-shadow:var(--shadow); position:relative; }
    .field { display:flex; flex-direction:column; gap:7px; margin-top:15px; }
    .field label { font-size:12px; font-weight:700; color:#536a70; }
    .field input, .field select { border:1px solid var(--line); border-radius:8px; padding:12px; outline:none; color:var(--ink); background:#fbfdfc; }
    .toast { position:fixed; bottom:22px; right:22px; background:var(--ink); color:white; padding:14px 18px; border-radius:10px; z-index:1100; display:none; }
    .toast.show { display:block; }
  </style>
</head>
<body>
  <header class="shell topbar">
    <a href="index.html" class="brand">
      <div class="brand-mark">
        <img src="logo.jpg" alt="QuickPick Express Logo" />
      </div>
      <span>QuickPick <em>Express</em></span>
    </a>
    <div>
      <button class="outline" onclick="openAuthModal('customer')">Sign In / Register</button>
    </div>
  </header>

  <main class="shell hero">
    <span style="color:var(--blue);font-weight:700;text-transform:uppercase;letter-spacing:1px;font-size:12px;">Fast &amp; Reliable Logistics</span>
    <h1>Deliver anything, anywhere in town instantly.</h1>
    <p style="color:var(--muted);font-size:16px;">Connect with professional riders for safe deliveries backed by real-time Supabase tracking.</p>
    <div class="actions">
      <button class="primary" onclick="openAuthModal('customer')">Get Started as Customer</button>
      <button class="outline" onclick="openAuthModal('rider')">Register as Rider</button>
    </div>
  </main>

  <div class="modal-backdrop" id="auth-modal">
    <div class="modal">
      <h2 id="auth-modal-title" style="font-family:'Space Grotesk';margin-top:0;">Sign In or Register</h2>
      <p style="color:var(--muted);font-size:13px;" id="auth-modal-desc">Access your portal securely.</p>
      <div class="field"><label>Email Address</label><input type="email" id="auth-email" placeholder="name@example.com" /></div>
      <div class="field"><label>Password</label><input type="password" id="auth-password" placeholder="••••••••" /></div>
      <div class="field"><label>I am a:</label>
        <select id="auth-role">
          <option value="customer">Customer</option>
          <option value="rider">Rider</option>
        </select>
      </div>
      <button class="primary" style="width:100%;margin-top:20px;justify-content:center;" onclick="handleAuthSubmission()">Continue</button>
      <button style="background:none;color:var(--muted);width:100%;margin-top:12px;font-size:12px;" onclick="closeAuthModal()">Cancel</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    function openAuthModal(role){
      document.getElementById('auth-role').value = role;
      document.getElementById('auth-modal').classList.add('open');
    }
    function closeAuthModal(){
      document.getElementById('auth-modal').classList.remove('open');
    }
    async function handleAuthSubmission(){
      const email = document.getElementById('auth-email').value.trim();
      const password = document.getElementById('auth-password').value.trim();
      const role = document.getElementById('auth-role').value;

      if(!email || !password){ showToast('Please enter email and password.'); return; }

      let { data, error } = await supabase.auth.signInWithPassword({ email, password });
      
      if(error){
        const signUpRes = await supabase.auth.signUp({ email, password });
        if(signUpRes.error){
          showToast(signUpRes.error.message);
          return;
        }
        data = signUpRes;
        if(data.user){
          await supabase.from('profiles').insert([{ id: data.user.id, email, role }]);
        }
      }

      showToast('Authentication successful!');
      setTimeout(() => {
        window.location.href = role === 'rider' ? 'rider.html' : 'customer.html';
      }, 1000);
    }
    function showToast(msg){
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3000);
    }
    lucide.createIcons();
  </script>
</body>
</html>
