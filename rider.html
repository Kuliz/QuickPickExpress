<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rider Portal | QuickPick Express</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabaseClient.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');
    :root { --ink:#0e4c69; --muted:#5d7682; --paper:#f7f7f2; --white:#fff; --red:#ef4b3f; --blue:#1468a5; --green:#27a66f; --line:#dce8e3; --shadow:0 20px 60px rgba(14,76,105,.12); }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:var(--paper); font-family:'DM Sans',sans-serif; }
    button { cursor:pointer; border:0; }
    .shell { max-width:1240px; margin:auto; padding:0 30px; }
    .topbar { height:76px; display:flex; align-items:center; justify-content:space-between; }
    .brand { display:flex; align-items:center; gap:11px; font-family:'Space Grotesk'; font-size:20px; font-weight:700; text-decoration:none; color:var(--ink); }
    .brand-mark { height:40px; display:flex; align-items:center; }
    .brand-mark img { height:100%; width:auto; object-fit:contain; border-radius:8px; }
    .brand em { font-style:normal; color:#f7b32b; }
    .panel { background:white; border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); padding:28px; margin-top:20px; }
    .driver-cards { display:grid; grid-template-columns:repeat(3,1fr); gap:15px; margin-top:23px; }
    .request { padding:18px; border:1px solid var(--line); border-radius:11px; background:#fff; }
    .request h4 { margin:14px 0 6px; font-family:'Space Grotesk'; }
    .request p { color:var(--muted); font-size:13px; margin:5px 0; }
    .request .price { color:var(--red); font-weight:700; font-size:19px; margin:14px 0; }
    .primary { background:var(--red); color:white; padding:10px; border-radius:9px; font-weight:700; width:100%; text-align:center; }
    .outline { background:white; color:var(--ink); padding:12px 17px; border:1px solid var(--line); border-radius:9px; font-weight:700; }
    .modal-backdrop { display:none; position:fixed; inset:0; background:rgba(16,35,50,.55); z-index:1000; place-items:center; padding:20px; }
    .modal-backdrop.open { display:grid; }
    .modal { background:white; width:min(440px,100%); border-radius:16px; padding:28px; }
    .field { display:flex; flex-direction:column; gap:7px; margin-top:15px; }
    .field input { border:1px solid var(--line); border-radius:8px; padding:12px; outline:none; background:#fbfdfc; }
    .toast { position:fixed; bottom:22px; right:22px; background:var(--ink); color:white; padding:14px 18px; border-radius:10px; z-index:1100; display:none; }
    .toast.show { display:block; }
  </style>
</head>
<body>
  <header class="shell topbar">
    <a href="index.html" class="brand">
      <div class="brand-mark">
        <img src="logo.jpg" alt="QuickPick Express Logo" />
      </div>
      <span>QuickPick <em>Express</em></span>
    </a>
    <button class="outline" onclick="signout()">Sign Out</button>
  </header>

  <main class="shell" style="padding:40px 0;">
    <h2>Rider Delivery Workbench</h2>
    <div class="panel">
      <h3>Incoming Supabase Orders</h3>
      <div class="driver-cards" id="rider-requests"></div>
    </div>
  </main>

  <!-- Register Modal Gate if Not Signed In -->
  <div class="modal-backdrop" id="rider-auth-modal">
    <div class="modal">
      <h2>Register as a Rider</h2>
      <p style="color:var(--muted);font-size:14px;">Sign in or sign up to view live orders.</p>
      <div class="field"><label>Email</label><input id="r-email" placeholder="rider@example.com" /></div>
      <div class="field"><label>Password</label><input type="password" id="r-pass" placeholder="••••••••" /></div>
      <button class="primary" style="margin-top:20px;" onclick="registerRiderSession()">Authenticate &amp; Access</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    let riderRequests = [];

    async function checkRiderAuth(){
      const { data } = await supabase.auth.getUser();
      if(!data.user){
        document.getElementById('rider-auth-modal').classList.add('open');
      } else {
        loadRiderRequests();
        subscribeRealtime();
      }
    }

    async function registerRiderSession(){
      const email = document.getElementById('r-email').value.trim();
      const password = document.getElementById('r-pass').value.trim();
      if(!email || !password){ showToast('Enter email and password'); return; }

      let { data, error } = await supabase.auth.signInWithPassword({ email, password });
      if(error){
        const signUp = await supabase.auth.signUp({ email, password });
        if(signUp.error){ showToast(signUp.error.message); return; }
        data = signUp;
        await supabase.from('profiles').insert([{ id: data.user.id, email, role: 'rider' }]);
      }
      document.getElementById('rider-auth-modal').classList.remove('open');
      showToast('Logged in successfully!');
      loadRiderRequests();
      subscribeRealtime();
    }

    async function loadRiderRequests(){
      const { data, error } = await supabase
        .from('orders')
        .select('*')
        .order('created_at', { ascending: false });

      if(!error){
        riderRequests = data || [];
        renderDashboard();
      }
    }

    function subscribeRealtime(){
      supabase
        .channel('public:orders')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'orders' }, payload => {
          riderRequests.unshift(payload.new);
          renderDashboard();
          showToast('New delivery order received!');
        })
        .subscribe();
    }

    function renderDashboard(){
      const container = document.getElementById('rider-requests');
      container.innerHTML = riderRequests.length ? riderRequests.map(req => `
        <article class="request">
          <h4>${req.pickup} → ${req.dropoff}</h4>
          <p>Package: ${req.package_type} (${req.distance})</p>
          <p>Customer: ${req.customer_email}</p>
          <div class="price">${req.price}</div>
          <button class="primary" onclick="updateStatus('${req.id}', 'in-transit')">Accept Order</button>
        </article>
      `).join('') : '<p style="color:var(--muted);">No pending requests found in database.</p>';
    }

    async function updateStatus(id, newStatus){
      const { error } = await supabase.from('orders').update({ status: newStatus }).eq('id', id);
      if(!error){
        showToast('Order status updated!');
        loadRiderRequests();
      }
    }

    async function signout(){
      await supabase.auth.signOut();
      window.location.href = 'index.html';
    }

    function showToast(msg){
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      setTimeout(()=>t.classList.remove('show'), 3000);
    }

    checkRiderAuth();
  </script>
</body>
</html>
